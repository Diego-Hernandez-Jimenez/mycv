cv:
  name: Diego Hernández Jiménez
  headline:
  location: Madrid
  email: diego.her.jimenez@outlook.com
  photo:
  phone: +34 696276452
  website: https://diego-hernandez-jimenez.github.io/web/
  social_networks:
    - network: LinkedIn
      username: diego-hernández-jiménez
    - network: GitHub
      username: rendercv
  custom_connections:
  sections:
    presentation:
      - I am a data scientist with brief but highly productive experience in the field. My strong foundation in
      - statistical analysis and programming allows me to extract valuable insights from data. Additionally, my
      - background in psychology brings a unique perspective when analyzing human behavior. I am motivated by
      - continuous learning and data-driven problem solving.
    
    skills:
      - label: Languages
        details: Python, R, SQL, Java
      - label: ML Frameworks
        details: PyTorch, Scikit-Learn, MLflow, mlr3
      - label: Cloud
        details: Google Cloud, Databricks
      - label: Data engineering
        details: PySpark, dbt, Apache Beam

    experience:
      - company: Accenture
        position: Data Engineer
        date:
        start_date: 2025-09
        end_date: present
        location: Madrid, ES
        summary:
        highlights:
          - Built foundation model infrastructure serving 2M+ monthly API requests with 99.97% uptime
          - Raised $18M Series A led by Sequoia Capital, with participation from a16z and Founders Fund
          - Scaled engineering team from 3 to 28 across ML research, platform, and applied AI divisions
          - Developed proprietary inference optimization reducing latency by 73% compared to baseline
      - company: Havas Media
        position: Data Scientist
        date:
        start_date: 2023-09
        end_date: 2025-09
        location: Madrid, ES
        summary:
        highlights:
          - Designed sparse attention mechanism reducing transformer memory footprint by 4.2x
          - Co-authored paper accepted at NeurIPS 2022 (spotlight presentation, top 5% of submissions)

    education:
      - institution: Universitat Oberta de Catalunya
        area: Computer Science
        degree: BS
        date:
        start_date: 2022-09
        end_date: 
        location: Online
        summary:
        highlights:
          - 'Thesis: Efficient Neural Architecture Search for Resource-Constrained Deployment'
          - 'Advisor: Prof. Sanjeev Arora'
          - NSF Graduate Research Fellowship, Siebel Scholar (Class of 2022)
      - institution: Universidad Autónoma de Madrid
        area: Applied Statistics
        degree: MS
        date:
        start_date: 2014-09
        end_date: 2018-06
        location: Madrid, ES
        summary:
        highlights:
          - 'GPA: 3.97/4.00, Valedictorian'
          - Fulbright Scholarship recipient for Graduate Studies
    projects:
      - name: '[FlashInfer](https://github.com/)'
        date:
        start_date: 2023-01
        end_date: present
        location:
        summary: Open-source library for high-performance LLM inference kernels
        highlights:
          - Achieved 2.8x speedup over baseline attention implementations on A100 GPUs
          - Adopted by 3 major AI labs, 8,500+ GitHub stars, 200+ contributors
      - name: '[NeuralPrune](https://github.com/)'
        date: '2021'
        start_date:
        end_date:
        location:
        summary: Automated neural network pruning toolkit with differentiable masks
        highlights:
          - Reduced model size by 90% with less than 1% accuracy degradation on ImageNet
          - Featured in PyTorch ecosystem tools, 4,200+ GitHub stars
    
